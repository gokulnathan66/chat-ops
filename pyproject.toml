[project]
name = "llmops"
version = "0.2.0"
description = "Production-grade LangGraph RAG API with LLMOps tooling: observability, prompt versioning, evaluation pipelines, HITL, and one-command Terraform infrastructure"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13,<3.14"
keywords = ["llmops", "rag", "langgraph", "bedrock", "qdrant", "langfuse", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "boto3>=1.42.80",
    "fastapi>=0.135.3",
    "langchain>=1.0.0",
    "langchain-aws>=1.4.2",
    "langchain-core>=1.2.24",
    "langfuse>=4.0.6",
    "langgraph>=1.1.4",
    "pydantic>=2.12",
    "pydantic-settings>=2.13.1",
    "pypdf>=6.9.2",
    "qdrant-client>=1.17.1",
    "sentence-transformers>=5.3.0",
    "uvicorn>=0.42.0",
]

[dependency-groups]
dev = [
    "moto[dynamodb]>=5.1.22",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src", "evaluations"]
omit = ["tests/*", "data/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["src", "evaluations"]

